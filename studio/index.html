<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#edeee8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161812" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="스튜디오 매물">
<!-- 앱 화면을 고칠 때마다 이 값을 바꾼다. 휴대폰에 떠 있던 예전 화면이 이 값을 보고 새 화면으로 다시 열린다 -->
<meta name="app-version" content="2026-11-22-4">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<title>스튜디오 매물</title>
<link rel="manifest" href="manifest.webmanifest?v=1">
<link rel="apple-touch-icon" href="icon-180.png?v=1">
<link rel="icon" type="image/png" href="icon-192.png?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 글꼴은 화면을 막지 않게 따로 받는다. 받기 전에는 기기 글꼴로 먼저 보인다 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" crossorigin media="print" onload="this.media='all'">
<style>
/* 레이아웃: 한 손으로 넘겨 보는 앱. 카드마다 사진, 가격, 거리, 연락 버튼을 먼저 보여 주고 나머지는 펼쳐서 본다. */
:root {
  color-scheme: light dark;
  --bg: #edeee8; --surface: #f9f9f4; --ink: #20231c; --muted: #5d6156; --line: #d2d4c9;
  --onair: #c4291c; --on-onair: #ffffff; --marker: #f2d34f; --marker-ink: #2a2600; --warn: #8f5400;
  --display: "Black Han Sans", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161812; --surface: #1f221a; --ink: #ecede4; --muted: #a8ab9d; --line: #363a2e;
    --onair: #f0665a; --on-onair: #1b0b09; --marker: #e8c93c; --marker-ink: #241f00; --warn: #e3ae57;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.6 var(--body); word-break: keep-all; overflow-wrap: anywhere; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
a { color: inherit; }
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 16px;
  padding-top: max(16px, env(safe-area-inset-top, 0px));
  padding-bottom: max(32px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* 맨 위 */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font: 400 28px/1.15 var(--display); margin: 0; letter-spacing: .01em; }
.refresh { border: 1px solid var(--line); background: var(--surface); padding: 0 14px; min-height: 44px; font-weight: 500; font-size: 14px; cursor: pointer; }
.refresh[disabled] { color: var(--muted); }
.status { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
.stale { margin: 6px 0 0; font-size: 14px; font-weight: 500; color: var(--warn); }
.runNote { margin: 0 0 12px; font-size: 14px; color: var(--muted); }

/* 사이트별 건수 */
.box ul.sites { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 4px 0 12px; padding: 0; list-style: none; font-size: 14px; }
.sites b { font-weight: 500; color: var(--muted); margin-right: 3px; }
.sites .off { color: var(--warn); font-weight: 500; }
.naver { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface); border: 1px solid var(--line); padding: 6px 6px 6px 12px; font-size: 14px; color: var(--muted); }
.naver a { flex: none; min-height: 40px; display: inline-flex; align-items: center; padding: 0 12px; border: 1px solid var(--ink); color: var(--ink); font-size: 14px; font-weight: 500; text-decoration: none; }

/* 탭: 스튜디오 / 방 */
.tabs { display: flex; border: 1px solid var(--ink); }
.tab { flex: 1 1 0; min-height: 48px; border: 0; background: var(--surface); font-weight: 700; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
.tab + .tab { border-left: 1px solid var(--ink); }
.tab small { font-weight: 500; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.tab[aria-selected="true"] small { color: inherit; opacity: .8; }

/* 정렬 */
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.count { width: 100%; font-weight: 700; }
.sort { border: 1px solid var(--line); background: var(--surface); padding: 0 12px; min-height: 40px; font-weight: 500; font-size: 14px; cursor: pointer; }
.sort[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
:focus-visible { outline: 2px solid var(--onair); outline-offset: 2px; }

/* 카드 */
.list { display: grid; gap: 16px; }
.card { display: grid; grid-template-columns: minmax(0, 44%) minmax(0, 1fr); background: var(--surface); border: 1px solid var(--line); }
.media { display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--line); }
.gallery { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; background: #0e0f0c; min-height: 240px; max-height: 420px; flex: 1; }
.thumb { flex: 0 0 100%; scroll-snap-align: start; border: 0; padding: 0; margin: 0; background: none; cursor: zoom-in; display: flex; align-items: center; justify-content: center; min-width: 0; }
.thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
.noPhoto { flex: 1; display: grid; place-items: center; color: #d8d9cf; padding: 24px; text-align: center; }
.photoNote { font-size: 12px; color: var(--muted); padding: 6px 12px; border-top: 1px solid var(--line); }
.info { padding: 14px 16px 16px; display: grid; gap: 10px; min-width: 0; align-content: start; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 13px; color: var(--muted); }
.new { background: var(--onair); color: var(--on-onair); padding: 1px 7px; font-weight: 700; font-size: 12px; letter-spacing: .04em; }
.price { font: 400 32px/1.1 var(--display); margin: 0; font-variant-numeric: tabular-nums; }
.price small { font: 500 14px/1 var(--body); color: var(--muted); margin-left: 4px; }
.monthly { margin: 4px 0 0; font-weight: 500; }
.monthly mark { background: var(--marker); color: var(--marker-ink); padding: 0 5px; font-weight: 700; }
.monthly span { color: var(--muted); font-weight: 400; font-size: 13px; }
.monthly .extra { font-weight: 700; margin-right: 4px; }
.addr { margin: 0; font-weight: 700; }
.viol { margin: 0; font-size: 13px; font-weight: 700; color: var(--onair); }
.far { margin: 0; font: 400 19px/1.3 var(--display); }
.specs { margin: 0; color: var(--muted); font-size: 14px; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.act { flex: 1 1 calc(50% - 3px); min-height: 46px; padding: 6px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.25; background: transparent; border: 1px solid var(--ink); color: var(--ink); text-decoration: none; font-weight: 700; font-size: 15px; text-align: center; cursor: pointer; }
.act small { font-weight: 400; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.act.primary { background: var(--onair); border-color: var(--onair); color: var(--on-onair); }
.act.primary small { color: inherit; }
.agency { margin: 0; font-size: 13px; color: var(--muted); }
.request { border: 1px dashed var(--warn); padding: 10px 12px; display: grid; gap: 8px; }
.request strong { font-size: 14px; }
.request .sent { color: var(--warn); font-size: 13px; font-weight: 500; }
.request p { margin: 0; font-size: 14px; }
.copy { justify-self: start; min-height: 40px; padding: 0 12px; border: 1px solid var(--line); background: transparent; font-size: 14px; font-weight: 500; cursor: pointer; }
.more { border-top: 1px solid var(--line); padding-top: 4px; }
.more > summary { cursor: pointer; font-weight: 500; font-size: 14px; min-height: 40px; display: flex; align-items: center; }
.block { margin-top: 10px; }
.block h3 { margin: 0 0 4px; font-size: 13px; font-weight: 700; }
.block p { margin: 0; }
.route { display: grid; grid-template-columns: 3.4em minmax(0, 1fr); gap: 2px 8px; margin: 0; }
.route dt { color: var(--muted); font-size: 13px; line-height: 1.75; }
.route dd { margin: 0; }
.cautions { margin: 4px 0 0; padding: 0 0 0 1.1em; color: var(--warn); font-size: 14px; }

.empty { background: var(--surface); border: 1px solid var(--line); padding: 28px 20px; color: var(--muted); }
.box { background: var(--surface); border: 1px solid var(--line); padding: 4px 14px; }
.box > summary { cursor: pointer; font-weight: 700; min-height: 44px; display: flex; align-items: center; }
.box ul { margin: 4px 0 12px; padding-left: 1.2em; }
.goneList { display: grid; gap: 6px; list-style: none; padding: 0 !important; color: var(--muted); }

/* 처음 한 번 코드 넣는 화면 */
.gate { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.gate form { width: 100%; max-width: 360px; display: grid; gap: 12px; }
.gate p { margin: 0; color: var(--muted); }
.gate input { width: 100%; min-height: 50px; padding: 0 12px; background: var(--surface); border: 1px solid var(--ink); border-radius: 0; font-size: 18px; letter-spacing: .04em; }
.gate .act { flex: none; width: 100%; }
.gate .err { color: var(--warn); font-weight: 500; font-size: 14px; min-height: 1.6em; }

#viewer { position: fixed; inset: 0; z-index: 30; background: rgba(10, 11, 8, .94); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
#viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
.close { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); border: 1px solid #d8d9cf; background: #0e0f0c; color: #f0f0e8; padding: 0 16px; min-height: 44px; font-weight: 500; font-size: 14px; cursor: pointer; }

@media (max-width: 760px) {
  .card { grid-template-columns: minmax(0, 1fr); }
  .media { border-right: 0; border-bottom: 1px solid var(--line); }
  .gallery { flex: none; height: 62vw; min-height: 200px; max-height: 340px; }
}
@media (prefers-reduced-motion: no-preference) { .gallery { scroll-behavior: smooth; } }
</style>
</head>
<body>

<div class="gate" id="gate" hidden>
  <form id="gateForm">
    <h1>스튜디오 매물</h1>
    <p>처음 한 번만 앱 코드를 넣어 주세요. 그다음부터는 바로 열립니다.</p>
    <input id="gateInput" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="앱 코드" placeholder="앱 코드">
    <p class="err" id="gateErr" role="alert"></p>
    <button class="act primary" type="submit" id="gateBtn">열기</button>
  </form>
</div>

<div class="wrap" id="app" hidden>
  <header>
    <div class="top">
      <h1>스튜디오 매물</h1>
      <button class="refresh" id="refresh" type="button">새로고침</button>
    </div>
    <p class="status" id="status"></p>
    <p class="stale" id="stale" hidden></p>
  </header>

  <nav class="tabs" role="tablist" aria-label="찾는 매물">
    <button class="tab" role="tab" type="button" data-tab="studio" aria-selected="true">스튜디오 <small id="countStudio"></small></button>
    <button class="tab" role="tab" type="button" data-tab="rooms" aria-selected="false">방 <small id="countRooms"></small></button>
  </nav>

  <div class="naver" id="naver" hidden>
    <span>네이버부동산은 직접 확인해야 해요</span>
    <a href="https://m.land.naver.com/" target="_blank" rel="noopener">열기</a>
  </div>

  <section class="toolbar" aria-label="정렬">
    <span class="count" id="count"></span>
    <button class="sort" data-sort="newest" aria-pressed="true" type="button">최신순</button>
    <button class="sort" data-sort="near" aria-pressed="false" type="button" id="sortNear">가까운 순</button>
    <button class="sort" data-sort="cheap" aria-pressed="false" type="button">월 비용 낮은 순</button>
    <button class="sort" data-sort="wide" aria-pressed="false" type="button">넓은 순</button>
  </section>

  <main class="list" id="list"></main>

  <details class="box" id="goneBox" hidden>
    <summary id="goneTitle">내려간 매물</summary>
    <ul class="goneList" id="goneList"></ul>
  </details>

  <details class="box">
    <summary>사이트별 찾기 결과</summary>
    <ul class="sites" id="sites"></ul>
    <p class="runNote" id="runNote" hidden></p>
    <p class="runNote" id="cond" hidden></p>
  </details>

  <details class="box">
    <summary>계약 전에 꼭 물어볼 것</summary>
    <ul id="askList"></ul>
  </details>
</div>

<div id="viewer" hidden>
  <button class="close" id="closeViewer" type="button">닫기</button>
  <img id="viewerImg" alt="매물 사진 크게 보기">
</div>

<script>
(function () {
  /* 매물 찾기는 오전 10시 30분과 오후 5시 30분. 가장 긴 간격(오후 → 다음 날 오전) 17시간에 여유 2시간을 더한 19시간이 지나면 늦었다고 알린다 */
  var SALT = 'ketaku-studio-v1', ROUNDS = 200000, STALE_HOURS = 19, RECHECK_MS = 5 * 60 * 1000;
  var PHOTO_CACHE = 'studio-photos-v2', PHOTO_WORKERS = 3;
  var IOS = /iPhone|iPad|iPod/.test(navigator.userAgent);

  var el = function (id) { return document.getElementById(id); };
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  var esc = function (v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var safeUrl = function (u) { return /^https:\/\//.test(u || '') ? u : ''; };
  // 직방 www 주소는 휴대폰에서 앱 설치 안내 화면으로 넘어가 매물이 안 보인다. m 주소는 매물을 바로 보여 주고, 직방 앱이 있으면 앱에서 그 매물을 연다
  var sourceUrl = function (u) { return safeUrl(u).replace(/^https:\/\/(www\.)?zigbang\.com\//, 'https://m.zigbang.com/'); };
  var num = function (v, d) { return typeof v === 'number' ? v : d; };
  var total = function (l) { return num(l.monthlyTotal, num(l.rent, 0) + num(l.mgmt, 0)); };
  /* 한 달 금액은 월세 + 기본 관리비다. 전기·가스 등을 따로 내면 금액 옆에 '+ 실비'(사용한 만큼) 또는 '+ 공과금'을 붙인다 */
  var extraCost = function (l) {
    var s = String(l.mgmtLabel || '');
    if (/ \+ .*실비/.test(s)) return '실비';
    if (/ \+ .*따로|공과금\s*(따로|별도)/.test(s)) return '공과금';
    return '';
  };
  var cleanCode = function (s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, ''); };
  var digits = function (p) { return String(p || '').replace(/\D/g, ''); };
  var isMobile = function (p) { return /^(01|050)/.test(digits(p)); };
  var smsHref = function (p, body) { return 'sms:' + digits(p) + (IOS ? '&' : '?') + 'body=' + encodeURIComponent(body); };
  var when = function (iso) { var t = Date.parse(iso || ''); return isNaN(t) ? 0 : t; };

  /* 탭마다 다른 글. 스튜디오는 집(로제트화양)에서 가는 길, 방은 가까운 지하철역을 보여 준다 */
  var TABS = {
    studio: {
      sortStore: 'studioSortV2', far: '집에서 ', route: '집에서 가는 길', near: '가까운 순',
      empty: '지금은 조건에 맞는 매물이 없습니다. 오전 10시 30분과 오후 5시 30분에 다시 찾아 올립니다.',
      none: '매물을 불러오는 중이에요.',
      ask: [
        '방송 촬영과 팟캐스트 녹화 용도로 써도 되는지, 게스트 출입이 괜찮은지',
        '건축물 용도가 주택일 때 사업장 주소로 등록할 수 있는지',
        '최근 몇 년 사이 침수나 누수가 있었는지, 곰팡이가 있는지',
        '인터넷 회선을 새로 넣을 수 있는지, 조명과 장비를 켜도 전기 용량이 충분한지',
        '윗집과 옆집에 소리가 얼마나 들리는지, 벽에 흡음재를 붙여도 되는지',
        "관리비가 '확인 필요'인 매물은 관리비를 더해도 조건 안인지",
        '건축물대장에 위반건축물 표시가 없는지, 등기부등본에 근저당이 있는지'
      ]
    },
    rooms: {
      sortStore: 'roomsSortV1', far: '', route: '가까운 역', near: '역 가까운 순',
      empty: '지금은 조건에 맞는 매물이 없습니다. 오전 9시 40분과 오후 4시 40분에 다시 찾아 올립니다.',
      none: '아직 찾은 결과가 없어요. 첫 찾기가 끝나면 여기에 나옵니다.',
      ask: [
        '어떤 위반인지(무단 증축, 용도 변경, 방 쪼개기 등), 철거·원상복구 명령이나 이행강제금이 걸려 있는지',
        '전입신고 없이 살아도 되는지, 계약서에 위반건축물(또는 전입 불가 조건)임을 적어 줄 수 있는지',
        "'전입신고 불가' 매물은 왜 안 되는지(근린생활시설, 업무용, 전대차 등)와 집주인 동의가 있는지",
        '전입신고를 안 하면 보증금을 지킬 권리(대항력·우선변제)가 없으니 보증금은 적을수록 안전',
        '등기부등본에 근저당·가압류·임차권등기가 있는지',
        '단속으로 나가야 하게 되면 보증금을 바로 돌려받는 조건을 계약서에 넣을 수 있는지',
        '관리비에 들어가는 항목과 전기·가스·수도·난방·인터넷 중 실비로 따로 내는 것이 무엇인지, 한 달에 보통 얼마 나오는지',
        '옥탑이면 습기, 곰팡이, 냉난방비'
      ]
    }
  };
  var tab = store.get('studioTabV1') === 'rooms' ? 'rooms' : 'studio';
  var data = { studio: { meta: null, listings: [] }, rooms: { meta: null, listings: [] } };

  /* 카드는 매물마다 한 번 만들어 두고 내용이 바뀐 매물만 새로 만든다.

    loading = true;
    var btn = el('refresh');
    if (byHand) { btn.disabled = true; btn.textContent = '확인 중'; }
    return fetchBoard().then(openBoard).then(function (plain) {
      var text = new TextDecoder().decode(plain);
      lastFetch = Date.now();
      if (!keyChecked) { keyChecked = true; queuePhotos(shown); }
      if (text !== boardText) {
        var board = JSON.parse(text);
        store.set('studioBoard', text);
        boardText = text;
        show(board);
        tidyPhotos();
      } else {
        renderHead();
      }
      if (byHand) { btn.textContent = '최신이에요'; setTimeout(function () { btn.textContent = '새로고침'; }, 1500); }
    }).catch(function (err) {
      if (err && err.wrongCode) {
        store.del('studioCode');
        store.del('studioKey');
        aesKey = null;
        showGate('앱 코드가 바뀌었어요. 새 코드를 넣어 주세요.');
        return;
      }
      var meta = data[tab].meta;
      if (!boardText) el('status').textContent = '매물을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침을 눌러 주세요.';
      else el('status').textContent = (meta ? '마지막 확인 ' + (meta.lastRunLabel || '') + ' · ' : '') + '인터넷이 안 돼 저장된 매물을 보여 줘요';
      if (byHand) { btn.textContent = '연결 안 됨'; setTimeout(function () { btn.textContent = '새로고침'; }, 1800); }
    }).then(function () { loading = false; btn.disabled = false; });
  }

  /* 저장해 둔 매물을 바로 그린다. 열쇠나 인터넷을 기다리지 않는다 */
  function start() {
    el('gate').hidden = true;
    el('app').hidden = false;
    renderTabs();
    var saved = store.get('studioBoard');
    if (saved && saved !== boardText) {
      try { show(JSON.parse(saved)); boardText = saved; } catch (e) { store.del('studioBoard'); }
    }
    if (!boardText) el('status').textContent = '매물을 불러오는 중이에요.';
  }

  /* 코드 확인: 실제로 데이터가 풀려야 코드와 열쇠를 저장한다. 열쇠 만들기와 데이터 받기를 함께 한다 */
  function tryCode(code) {
    return Promise.all([makeKey(code), fetchBoard()]).then(function (got) {
      var made = got[0];
      return open(got[1], made.key).then(function (plain) {
        store.set('studioCode', code);
        store.set('studioKey', made.raw);
        store.set('studioBoard', new TextDecoder().decode(plain));
        keyFromStore = false;
        lastFetch = Date.now();
        useKey(made.key, true);
        return true;
      }, function () { throw wrongCode(); });
    });
  }
  function showGate(msg) {
    el('app').hidden = true;
    el('gate').hidden = false;
    el('gateErr').textContent = msg || '';
  }

  el('gateForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var code = cleanCode(el('gateInput').value);
    if (!code) { el('gateErr').textContent = '앱 코드를 넣어 주세요.'; return; }
    el('gateBtn').disabled = true;
    el('gateErr').textContent = '';
    tryCode(code).then(start, function (err) {
      el('gateErr').textContent = err && err.wrongCode ? '코드가 맞지 않아요. 다시 확인해 주세요.' : '연결이 안 돼요. 인터넷을 확인하고 다시 눌러 주세요.';
    }).then(function () { el('gateBtn').disabled = false; });
  });

  /* 누르기 */
  document.addEventListener('click', function (e) {
    var tb = e.target.closest('.tab');
    if (tb) { switchTab(tb.dataset.tab); return; }
    var s = e.target.closest('.sort');
    if (s) { sorts[tab] = s.dataset.sort; store.set(TABS[tab].sortStore, sorts[tab]); render(); return; }
    if (e.target.closest('#refresh')) { refresh(true); checkApp(true); return; }
    var a = e.target.closest('[data-ask]');
    if (a) {
      var now = new Date();
      asked[a.dataset.ask] = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
      store.set('studioAsked', JSON.stringify(asked));
      setTimeout(render, 400);
      return;
    }
    var c = e.target.closest('.copy');
    if (c) {
      var text = c.dataset.copy, label = c.textContent;
      var done = function (m) { c.textContent = m; setTimeout(function () { c.textContent = label; }, 1400); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { done('복사됨'); }, function () { done('직접 선택해 주세요'); });
      } else { done('직접 선택해 주세요'); }
      return;
    }
    var t = e.target.closest('.thumb');
    if (t) {
      el('viewer').hidden = false;
      el('closeViewer').focus();
      photoUrl(t.dataset.photo).then(function (u) { if (!el('viewer').hidden) el('viewerImg').src = u; }, function () {});
      return;
    }
    if (e.target.id === 'viewer' || e.target.id === 'closeViewer') { el('viewer').hidden = true; el('viewerImg').removeAttribute('src'); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !el('viewer').hidden) { el('viewer').hidden = true; el('viewerImg').removeAttribute('src'); }
  });
  /* 앱으로 돌아올 때 새 앱 화면과 새 결과 확인 */
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    checkApp(false);
    if (aesKey && Date.now() - lastFetch > RECHECK_MS) refresh(false);
  });
  window.addEventListener('pageshow', function (e) { if (e.persisted) checkApp(true); });
  window.addEventListener('load', function () { checkApp(true); });

  /* 시작: 저장된 코드가 있으면 저장해 둔 매물부터 바로 보여 주고 새 결과를 확인한다. 없으면 주소에 있는 코드를 쓴다 */
  var fromLink = cleanCode(location.hash.slice(1));
  var savedCode = cleanCode(store.get('studioCode'));
  if (savedCode) {
    start();
    loadKey(savedCode).then(function () { refresh(false); }, function () { showGate(); });
  } else if (fromLink) {
    tryCode(fromLink).then(start, function (err) {
      showGate(err && err.wrongCode ? '코드가 맞지 않아요. 다시 확인해 주세요.' : '연결이 안 돼요. 인터넷을 확인하고 다시 열어 주세요.');
      if (!(err && err.wrongCode)) el('gateInput').value = fromLink;
    });
  } else {
    showGate();
  }

  /* 앱 화면·사진·글꼴을 기기에 보관해 다음부터 더 빨리 열리고, 인터넷이 약하거나 끊겨도 열리게 한다 (sw.js) */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
